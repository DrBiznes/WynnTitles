plugins {
	// Minecraft 26.1+ is unobfuscated: switch to "net.fabricmc.fabric-loom" and
	// drop the "mod" prefix from configurations. See PORTING.md.
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.wispforest.io/releases/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
	// owo-lib depends on kdl4j, which is only published on JitPack.
	exclusiveContent {
		forRepository { maven { url = "https://jitpack.io" } }
		filter { includeGroup "com.github.kdl-org" }
	}
}

loom {
	runs {
		client {
			// Lets `./gradlew runClient` log in to a local server started with
			// WT_OFFLINE_AUTH=true. See README.md.
			property "wynntitles.serverUrl", "http://localhost:8080"
		}
	}
}

// Client game tests (src/gametest) boot the real client into a singleplayer
// world. Run them with scripts/smoke-test.sh, which starts a throwaway server.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wynntitles-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.configureEach {
	if (name == "clientGameTest") {
		property "wynntitles.serverUrl", System.getProperty("wynntitles.testServer", "http://localhost:8080")
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Players install Wynntils themselves; we only compile against it.
	modCompileOnly "maven.modrinth:wynntils:${wynntils_version_id}"
	modLocalRuntime "maven.modrinth:wynntils:${wynntils_version_id}"

	// owo-lib is installed separately; sentinel offers to download it if missing.
	modImplementation "io.wispforest:owo-lib:${owo_version}"
	include "io.wispforest:owo-sentinel:${owo_version}"

	modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

	modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// ServerContractTest runs only when pointed at a server; see its javadoc.
	def testServer = System.getProperty("wynntitles.testServer")
	if (testServer) {
		systemProperty "wynntitles.testServer", testServer
		// The server is a fresh database every run, so never skip as up to date.
		outputs.upToDateWhen { false }
	}
	// WynncraftPackTest checks catalog icons against a cached Wynncraft pack.
	def wynnPack = System.getProperty("wynntitles.wynnPack")
	if (wynnPack) {
		systemProperty "wynntitles.wynnPack", wynnPack
		outputs.upToDateWhen { false }
	}
	testLogging { events "passed", "skipped", "failed"; exceptionFormat "full" }
}

processResources {
	def props = [
		version: project.version,
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		java_version: project.java_version,
	]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as Integer
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from(rootProject.file("../LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
